plugins {
    id 'com.android.application'
}

def runNumber = Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER") ?: "1")

android {
    namespace 'com.alexspec.zx'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alexspec.zx'
        minSdk 24
        targetSdk 35
        versionCode runNumber
        versionName "1.0.${runNumber}"
    }

    // Release signing key (ADR-011/ADR-014): in CI it comes from GitHub secrets via environment
    // variables; without them (until the secrets exist) the old key from the repository is used.
    def ksPath = System.getenv("SIGNING_KEYSTORE")
    signingConfigs {
        emu {
            storeFile ksPath ? file(ksPath) : file('../app/emu.keystore')
            storePassword System.getenv("SIGNING_STORE_PASSWORD") ?: 'specialist'
            keyAlias System.getenv("SIGNING_KEY_ALIAS") ?: 'emu'
            keyPassword System.getenv("SIGNING_KEY_PASSWORD") ?: 'specialist'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.emu
        }
        debug {
            signingConfig signingConfigs.emu
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        encoding 'UTF-8'
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
