name: Build Specialist shell ROM

on:
  push:
    branches: [ main ]
    paths: [ 'shell/**', 'tools/ShellSmoke.java', 'tools/ShellCompat.java', 'tools/ShellTiming.java', '.github/workflows/rom.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble
        run: |
          mkdir -p shell/build
          cd shell/src
          python3 ../tools/asm80.py main.asm -o ../build/shell.rom --base C000 --size 3000 -l ../build/shell.lst -s ../build/shell.sym

      - name: Base 2 KB unchanged (ADR-002)
        run: cmp <(head -c 2048 shell/build/shell.rom) <(head -c 2048 shell/base/spec_m2.rom)

      - name: Boots into the shell in the emulator core
        run: |
          mkdir -p /tmp/core
          javac -d /tmp/core app/src/main/java/com/alexspec/specialist/core/*.java tools/ShellSmoke.java
          java -cp /tmp/core ShellSmoke shell/build/shell.rom

      - name: Screen speed and scrolling (ROM-001)
        run: |
          javac -d /tmp/core -cp /tmp/core tools/ShellTiming.java
          java -Djava.awt.headless=true -Dstdout.encoding=UTF-8 -cp /tmp/core ShellTiming shell/build/shell.rom shell/build/shell.sym /tmp/timing 650

      - name: Program "Память" driven by keys (ROM-002)
        run: |
          javac -d /tmp/core -cp /tmp/core tools/ShellMemTest.java
          java -Djava.awt.headless=true -Dstdout.encoding=UTF-8 -cp /tmp/core ShellMemTest shell/build/shell.rom shell/build/shell.sym /tmp/memtest

      - name: Tape through the emulated recorder, both ways with Monitor-2 (ROM-006)
        run: |
          javac -d /tmp/core -cp /tmp/core tools/ShellTapeTest.java
          java -Djava.awt.headless=true -Dstdout.encoding=UTF-8 -cp /tmp/core ShellTapeTest shell/build/shell.rom shell/build/shell.sym shell/base/spec_m2.rom /tmp/tapetest

      - name: Program "Отладка" driven by keys (ROM-003)
        run: |
          javac -d /tmp/core -cp /tmp/core tools/ShellDbgTest.java
          java -Djava.awt.headless=true -Dstdout.encoding=UTF-8 -cp /tmp/core ShellDbgTest shell/build/shell.rom shell/build/shell.sym /tmp/dbgtest

      - name: Rename
        run: cp shell/build/shell.rom shell-${{ github.run_number }}.rom

      - uses: actions/upload-artifact@v4
        with:
          name: shell-rom-${{ github.run_number }}
          path: |
            shell-${{ github.run_number }}.rom
            shell/build/shell.lst

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rom-build-${{ github.run_number }}
          name: ПЗУ-оболочка «Специалиста», сборка ${{ github.run_number }}
          files: shell-${{ github.run_number }}.rom
          make_latest: false
          body: |
            Своё ПЗУ «Специалиста» с оболочкой. В эмуляторе: меню ☰ → «Сменить ПЗУ» → shell-${{ github.run_number }}.rom.
            После включения на «PROGRAM ?» нажмите F1, затем ВК.
