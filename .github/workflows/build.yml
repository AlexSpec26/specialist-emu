name: Build APK

on:
  push:
    branches: [ main ]
    # SPEC only: other products have their own workflows (ADR-013)
    paths: [ 'app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'tools/CpuTest.java', 'tools/MachineTest.java', 'tools/SpecTimeTest.java', '.github/workflows/build.yml' ]
  pull_request:
    # checks only: tests and an unsigned debug build, no release
    paths: [ 'app/**', 'build.gradle', 'settings.gradle', 'gradle.properties', 'tools/CpuTest.java', 'tools/MachineTest.java', 'tools/SpecTimeTest.java', '.github/workflows/build.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Core CPU self-test (8080 diagnostics)
        run: |
          mkdir -p /tmp/core
          javac -d /tmp/core app/src/main/java/com/alexspec/specialist/core/*.java tools/CpuTest.java
          git clone --depth 1 https://github.com/superzazu/8080 /tmp/t8080
          java -cp /tmp/core CpuTest /tmp/t8080/cpu_tests/TST8080.COM /tmp/t8080/cpu_tests/8080PRE.COM /tmp/t8080/cpu_tests/CPUTEST.COM | tee /tmp/cpu.log
          grep -q "CPU IS OPERATIONAL" /tmp/cpu.log
          grep -q "CPU TESTS OK" /tmp/cpu.log

      - name: Time control test (pause, steps, a minute of history)
        run: |
          mkdir -p /tmp/time
          javac -d /tmp/time app/src/main/java/com/alexspec/specialist/core/*.java tools/SpecTimeTest.java
          java -cp /tmp/time SpecTimeTest shell/base/spec_m2.rom | tee /tmp/time.log
          grep -q "SPEC TIME CONTROL OK" /tmp/time.log

      - name: Compile check (pull request)
        if: github.event_name == 'pull_request'
        run: gradle --no-daemon :app:assembleDebug

      - name: Signing key from secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PW: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PW" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PW" ]; then
            echo "::error::Signing secrets SIGNING_* are missing (ADR-014)"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$STORE_PW" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::Signing secrets do not open the key (check SIGNING_* values)"; exit 1; }
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PW" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PW" >> "$GITHUB_ENV"
          echo "::notice::Using the signing key from GitHub secrets"

      - name: Build APK
        if: github.event_name != 'pull_request'
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        if: github.event_name != 'pull_request'
        run: cp app/build/outputs/apk/release/app-release.apk specialist-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: specialist-apk-${{ github.run_number }}
          path: specialist-${{ github.run_number }}.apk

      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Специалист, сборка ${{ github.run_number }}
          files: specialist-${{ github.run_number }}.apk
          make_latest: true
          body: |
            Установка: скачайте specialist-${{ github.run_number }}.apk ниже на телефон и откройте файл.
            Обновление ставится поверх старой версии, настройки и программы сохраняются.
