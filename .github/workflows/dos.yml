name: Build DOS 286 APK

on:
  push:
    branches: [ main ]
    paths: [ 'dos/**', '!dos/**/*.md', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/dos.yml' ]
  pull_request:
    paths: [ 'dos/**', '!dos/**/*.md', 'build.gradle', 'settings.gradle', 'gradle.properties', '.github/workflows/dos.yml' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Native engine test (boot, keys, rewind 1 s / 5 s, saved states, start menu)
        run: make -s -j4 -f dos/src/main/jni/Makefile.host test
      - name: Compile development APK
        run: gradle --no-daemon :dos:assembleDebug
      - name: Signing key from secrets
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          STORE_PW: ${{ secrets.SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PW: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PW" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PW" ]; then
            echo "::error::Signing secrets SIGNING_* are missing (ADR-014)"; exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$STORE_PW" -alias "$KEY_ALIAS" > /dev/null \
            || { echo "::error::Signing secrets do not open the key (check SIGNING_* values)"; exit 1; }
          echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PW" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PW" >> "$GITHUB_ENV"
          echo "::notice::Using the signing key from GitHub secrets"

      - name: Signed DOS APK
        if: github.event_name != 'pull_request'
        run: |
          gradle --no-daemon :dos:assembleRelease
          cp dos/build/outputs/apk/release/dos-release.apk dos-286-${{ github.run_number }}.apk
          git archive --format=tar.gz -o dos-source-${{ github.run_number }}.tar.gz HEAD dos build.gradle settings.gradle gradle.properties
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: dos-286-apk-${{ github.run_number }}
          path: |
            dos-286-${{ github.run_number }}.apk
            dos-source-${{ github.run_number }}.tar.gz
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dos-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: DOS 286, сборка ${{ github.run_number }}
          files: |
            dos-286-${{ github.run_number }}.apk
            dos-source-${{ github.run_number }}.tar.gz
          make_latest: false
          body: |
            DOS 286 — старые игры для ПК на ядре DOSBox Pure. Установка: скачайте dos-286-${{ github.run_number }}.apk на телефон и откройте файл.
            Это отдельное приложение; обновление ставится поверх, игры и сохранения остаются.
            Перемотка назад на 1 и 5 секунд, замедление в 2, 3, 4 и 8 раз, быстрое сохранение и «сохранить как».
            Ядро DOSBox Pure — GPL-2.0-or-later; dos-source-${{ github.run_number }}.tar.gz — исходники именно этой сборки.
